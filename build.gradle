plugins {
    id 'java'
    id 'application'
}

group = 'me.grishka'
version = '1.0.0-alpha.4'

// MANDATORY: This tells the 'run' task which class to launch
application {
    mainClass = 'com.mojang.rubydung.RubyDung'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    flatDir { dirs 'src/lib' }
}

dependencies {
    implementation name: 'lwjgl'
    implementation name: 'lwjgl_util'
}
// Build the Fat JAR including all dependencies
jar {
    manifest {
        attributes 'Main-Class': 'com.mojang.rubydung.RubyDung'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('BuildExamples') {
    group = 'build'
    description = 'Compiles example mods and moves them to resources.'
    dependsOn jar

    doLast {
        def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        def gradlew = isWindows ? "${rootDir}/gradlew.bat" : "${rootDir}/gradlew"

        exec {
            workingDir 'examples/helloMod'
            commandLine gradlew, 'clean', 'build'
        }

        copy {
            from 'examples/helloMod/build/libs'
            include '*.jar'
            into 'src/main/resources/mods'
        }

        println "Example mods have been built and copied to src/main/resources/mods"
    }
}

tasks.build {
    dependsOn 'BuildExamples'
}

// CI/CD Task: Assembles the .minecraft directory structure
tasks.register('assembleMinecraftDist', Copy){
    dependsOn jar
    
    into "$buildDir/dist/.minecraft"

    // Place the JAR directly in the versions folder
    into("versions") {
        from "$buildDir/libs/${project.name}-${project.version}.jar"
        rename { "rd-132211.jar" }
    }

    into("mods") {
        from "src/main/resources/mods" // You can put default mods here
    }

    // Include the .OriginLoader metadata folder
    into(".OriginLoader") {
        from "src/main/resources/metadata"
    }
}

tasks.register('packageReleaseZip', Zip) {
    group = 'distribution'
    description = 'Packages OriginLoader using assembleMinecraftDist layout.'
    dependsOn assembleMinecraftDist, 'BuildExamples'

    archiveBaseName = "OriginLoader-${project.version}-Portable"
    destinationDirectory = file("$buildDir/distributions")

    // 1. Pack the entire .minecraft folder built by assembleMinecraftDist
    into(".minecraft") {
        from "$buildDir/dist/.minecraft"
    }

    // 2. Include natives inside .minecraft/bin/natives
    into(".minecraft/bin/natives") {
        from("src/lib/natives") {
            include '*.dll', '*.so', '*.dylib'
        }
    }

    // 3. Include launch scripts at root
    into("") {
        from("dist-scripts") {
            include "run.bat", "run.sh", "README.txt"
        }
    }
}
tasks.register('packageMDKZip', Zip) {
    group = 'distribution'
    description = 'Packages the Mod Development Kit (MDK) ZIP.'
    dependsOn jar

    archiveBaseName = "OriginLoader-${project.version}-MDK"
    destinationDirectory = file("$buildDir/distributions")

    // Mod template files
    from("mdk/")

    // Ensure Gradle wrapper files (including the binary jar) are bundled
    from(".") {
        include "gradlew", "gradlew.bat"
        include "gradle/wrapper/gradle-wrapper.jar"
        include "gradle/wrapper/gradle-wrapper.properties"
    }

    into("libs") {
        from tasks.jar.archiveFile
        rename { "OriginLoader.jar" }
    }
}

run {
    dependsOn 'assembleMinecraftDist'
    dependsOn 'BuildExamples'
    // Overrides user.home so the game looks in [project_root]/run/.minecraft
    systemProperty "user.home", file("$buildDir/dist").absolutePath
    standardInput = System.in

    jvmArgs = [
            "-Djava.library.path=${file('src/lib/natives').absolutePath}",
            "-Dorg.lwjgl.opengl.Display.noXRandR=true",
            "--add-opens=java.base/java.nio=ALL-UNNAMED",
            "--add-opens=java.desktop/sun.awt=ALL-UNNAMED"
    ]
    
    doFirst {
        println "----------------------------------------------------"
        println "LAUNCHING IN LOCAL SANDBOX MODE"
        println "Path: ${file("$buildDir/dist/.minecraft").absolutePath}"
        println "----------------------------------------------------"
    }
    jvmArgs = [
        "-Djava.library.path=${file('src/lib/natives').absolutePath}",
        "--add-opens=java.base/java.nio=ALL-UNNAMED",
        "--add-opens=java.desktop/sun.awt=ALL-UNNAMED"
    ]
}