plugins {
    id 'java'
    id 'application'
}

group = 'me.grishka'
version = '1.0-SNAPSHOT'

// MANDATORY: This tells the 'run' task which class to launch
application {
    mainClass = 'com.mojang.rubydung.RubyDung'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    flatDir { dirs 'src/lib' }
}

dependencies {
    implementation name: 'lwjgl'
    implementation name: 'lwjgl_util'
}

// Build the Fat JAR including all dependencies
jar {
    manifest {
        attributes 'Main-Class': 'com.mojang.rubydung.RubyDung'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// CI/CD Task: Assembles the .minecraft directory structure
tasks.register('assembleMinecraftDist', Copy){
    dependsOn jar
    
    into "$buildDir/dist/.minecraft"

    // Place the JAR directly in the versions folder
    into("versions") {
        from "$buildDir/libs/${project.name}-${project.version}.jar"
        rename { "rd-132211.jar" }
    }

    // Include the .OriginLoader metadata folder
    into(".OriginLoader") {
        from "src/main/resources/metadata"
    }
}

run {
    dependsOn 'assembleMinecraftDist'
    // Overrides user.home so the game looks in [project_root]/run/.minecraft
    systemProperty "user.home", file("$buildDir/dist").absolutePath
    standardInput = System.in
    
    doFirst {
        println "----------------------------------------------------"
        println "LAUNCHING IN LOCAL SANDBOX MODE"
        println "Path: ${file("$buildDir/dist/.minecraft").absolutePath}"
        println "----------------------------------------------------"
    }
    jvmArgs = [
        "-Djava.library.path=${file('src/lib/natives').absolutePath}",
        "--add-opens=java.base/java.nio=ALL-UNNAMED",
        "--add-opens=java.desktop/sun.awt=ALL-UNNAMED"
    ]
}